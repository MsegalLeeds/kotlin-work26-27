<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="https://httpbin.io/dump/request" method="POST">
    <label for="em">Enter your email:</label>
    <input type="email" id="em" name="email">
    <button>Submit</button>
    <input type="date" name="date" id="date" />
    <input type="color" name="color" id="color" />
    <legend>Choose staff or student</legend>
    <ul>
        <li>
            <label for="staff">staff</label>
            <input
                    type="checkbox"
                    id="staff"
                    name="role"
                    value="staff"
                    checked />
        </li>
        <li>
            <label for="student">student</label>
            <input type="checkbox" id="student" name="role" value="student" />
        </li>
    </ul>
</form>
</body>
</html>
